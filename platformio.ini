[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I src -Wdouble-promotion
build_src_filter = +<*> -<tests/>
lib_deps = 

[env:esp32dev_bench]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I src -Wdouble-promotion -DBENCH_TIMING
build_src_filter = +<*> -<tests/>
lib_deps = 
