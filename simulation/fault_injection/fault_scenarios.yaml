no_fault_baseline:
  description: Baseline
  type: none
  expected_outcome:
    criteria:
      angle_error_rms: 5.0
      max_angle_error: 15.0
      mean_speed: 10.0
      settling_time: 1.0
      speed_ripple_ptp: 450.0
scenario_1_rs_drift:
  type: parameter_drift
  param: Rs
  scale: 1.05
  onset_time: 1.5
  expected_outcome:
    fault_onset_time: 1.5
    expected_mode_after_fault: 2
    criteria:
      angle_error_rms: 8.0
      max_angle_error: 25.0
      mean_speed: 20.0
      speed_ripple_ptp: 450.0
scenario_2_offset_a_2_0:
  type: sensor_offset
  channel: a
  offset: 2.0
  onset_time: 2.0
  expected_outcome:
    fault_onset_time: 2.0
    expected_fault_channel: 1
    expected_mode_after_fault: 3
    criteria:
      detection_latency: 20.0
      fault_isolation: 1.0
      mean_speed: 50.0
      angle_error_rms: 10.0
      max_angle_error: 35.0
      speed_ripple_ptp: 450.0
      reconstruction_error_rms: 0.5
scenario_3_stuck_b_2_0:
  type: sensor_stuck
  channel: b
  onset_time: 2.0
  expected_outcome:
    fault_onset_time: 2.0
    expected_fault_channel: 2
    expected_mode_after_fault: 3
    criteria:
      detection_latency: 20.0
      fault_isolation: 2.0
      mean_speed: 50.0
      angle_error_rms: 10.0
      max_angle_error: 35.0
      speed_ripple_ptp: 450.0
      reconstruction_error_rms: 0.5
scenario_4_stuck_a_limit:
  type: sensor_stuck_limit
  channel: a
  limit: 10.0
  onset_time: 2.0
  expected_outcome:
    fault_onset_time: 2.0
    expected_fault_channel: 1
    expected_mode_after_fault: 3
    criteria:
      detection_latency: 12.0
      fault_isolation: 1.0
      mean_speed: 50.0
      angle_error_rms: 10.0
      max_angle_error: 60.0
      speed_ripple_ptp: 450.0
      reconstruction_error_rms: 1.5
scenario_5_simultaneous:
  type: sensor_offset
  speed_ref_rpm: 1800.0
  channel: c
  offset: 2.0
  onset_time: 1.5
  load_step:
    onset_time: 1.5
    torque_Nm: 0.1
  expected_outcome:
    fault_onset_time: 1.5
    expected_fault_channel: 3
    expected_mode_after_fault: 3
    criteria:
      detection_latency: 20.0
      fault_isolation: 3.0
      mean_speed: 50.0
      angle_error_rms: 10.0
      max_angle_error: 35.0
      speed_ripple_ptp: 450.0
      reconstruction_error_rms: 0.5
scenario_6_noise_burst:
  type: noise_burst
  channel: a
  magnitude: 2.0
  onset_time: 1.5
  duration: 0.1
  expected_outcome:
    fault_onset_time: 1.5
    expected_mode_after_fault: 2
    criteria:
      mean_speed: 300.0
      angle_error_rms: 15.0
      max_angle_error: 45.0
      speed_ripple_ptp: 450.0
      recovery_time: 0.55
scenario_7_inductance_mismatch:
