scenario_12_ambiguous_fault:
  type: simultaneous
  faults:
  - type: sensor_offset
    channel: a
    offset: 2.0
    onset_time: 2.0
  - type: sensor_offset
    channel: b
    offset: 2.0
    onset_time: 2.0
  - type: sensor_offset
    channel: c
    offset: 2.0
    onset_time: 2.0
  expected_outcome:
    fault_onset_time: 2.0
    expected_mode_after_fault: 4
    criteria:
      mean_speed: 300.0
      angle_error_rms: 20.0
      max_angle_error: 80.0
      speed_ripple_ptp: 1000.0
